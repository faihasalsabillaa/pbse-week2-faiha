openapi: 3.1.0

info:
  # TODO: your domain.
  title: Badminton Court Booking API
  # The version of this DOCUMENT. Not the same as the v1 in the URL.
  version: 0.1.0
  description: |
    This service allows users to view available badminton courts and time slots, make bookings, and allows staff to manage court and booking information.

    ## Conventions

    All monetary amounts are integers in the minor unit of the stated
    currency; the currency is carried explicitly beside every amount.
    All timestamps are RFC 3339 with an explicit UTC offset, for
    example 2026-03-04T12:10:04+07:00.

    Clients MUST ignore unknown response fields. Clients MUST treat an
    unrecognised enumeration value as the nearest non-terminal state
    and MUST NOT crash on it. These two sentences are what make every
    additive change to this interface legal.

    ## Idempotency

    TODO: the four sentences from Worksheet W2 — header name and
    format, which operations require it, the retention window as a
    number, and the behaviour on reuse with a different body.

    ## State machine

    TODO: the transition table from Worksheet W4. Any pair of statuses
    not listed there is illegal and returns 409 illegal-transition.

servers:
  - url: https://api.example.com/v1
    description: Production — does not exist yet. That is Meeting 3.
  - url: http://localhost:8080/v1
    description: Local development

tags:
  - name: Things
    description: TODO — rename to your primary resource.

paths:

  # -------------------------------------------------------------------
  # A collection GET with a filter parameter. Required for L2.
  # Rule 2: removing a query parameter must give you MORE results of the
  # same kind, never a DIFFERENT kind of thing.
  # -------------------------------------------------------------------
  /courts:
    get:
      operationId: listCourts
      summary: List badminton courts
      tags: [Courts]
      description: |
        Returns all badminton courts. Courts that are currently
        unavailable are included with isAvailable false, so clients
        can display them as unavailable rather than silently omitting
        them.
      parameters:
        - name: isAvailable
          in: query
          required: false
          description: Filter courts by whether they are available for booking.
          schema:
            type: boolean
      responses:
        '200':
          description: The list of badminton courts.
          content:
            application/json:
              schema:
                type: array
                items:
                  $ref: '#/components/schemas/Court'
        '400':
          $ref: '#/components/responses/BadRequest'

  /bookings:
    post:
      operationId: createBooking
      summary: Create a badminton court booking
      tags: [Bookings]
      description: |
        Creates a booking for a badminton court and time slot.
        The client must provide an Idempotency-Key when confirming
        the booking. The same key must be reused for retries of the
        same booking request.
      parameters:
        - name: Idempotency-Key
          in: header
          required: true
          schema:
            type: string
            format: uuid
          example: 0f7c1b9e-3d21-4a6f-9c05-8e2b7d41a9f0
          description: |
            Generated by the client at the moment the user confirms a booking,
            and reused unchanged for every retry of that same booking
            intention. Retained 24 hours. Reusing the same key with a different
            request body returns 409 idempotency-key-reuse.
      requestBody:
        required: true
        content:
          application/json:
            schema:
              $ref: '#/components/schemas/NewBooking'
      responses:
        '201':
          description: |
            Created — or, on a retry with the same key and the same
            body, the replayed original response.
          headers:
            Location:
              description: URI of the created booking.
              schema:
                type: string
              example: /v1/bookings/bkg_51Fa
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/Booking'
        '409':
          $ref: '#/components/responses/Conflict'
        '422':
          $ref: '#/components/responses/UnprocessableEntity'
    # -----------------------------------------------------------------
    # The unsafe, consequential operation. Required for L2.
    # The idempotency key is declared REQUIRED, so it is impossible to
    # read this document and not know about it.
    # -----------------------------------------------------------------

  /things/{thingId}:
    parameters:
      - name: thingId
        in: path
        required: true
        description: Opaque, server-generated. Never a database integer.
        schema:
          type: string
          pattern: '^thg_[A-Za-z0-9]{3,}$'
        example: thg_51Fa93cD
    get:
      operationId: getThing
      summary: Fetch one thing
      tags: [Things]
      responses:
        '200':
          description: The thing.
          content:
            application/json:
              schema: { $ref: '#/components/schemas/Booking' }
        '404': { $ref: '#/components/responses/NotFound' }

  # -------------------------------------------------------------------
  # Rule 5 — a state transition is a sub-resource, and its URI is a
  # NOUN. Not /markRetired, not PATCH {"status":"retired"}.
  # -------------------------------------------------------------------

components:
  schemas:

    Court:
      type: object
      required: [id, name, location, isAvailable, condition, createdAt]
      properties:
        id:
          type: string
          description: Unique identifier for the badminton court.
          example: crt_B16

        name:
          type: string
          description: Name of the badminton court.
          example: Court B16

        location:
          type: string
          description: Location of the badminton court.
          example: Indoor Hall B

        isAvailable:
          type: boolean
          description: Whether the court is currently available for booking.
          example: true

        condition:
          type: string
          description: Current physical condition of the court.
          example: Good

        createdAt:
          type: string
          format: date-time
          description: RFC 3339 timestamp with an explicit offset.
          example: '2026-03-04T12:10:04+07:00'

    NewBooking:
      type: object
      required: [courtId, userId, bookingDate, startTime, endTime]
      properties:
        courtId:
          type: string
          description: Identifier of the badminton court to book.
          example: crt_B16

        userId:
          type: string
          description: Identifier of the user making the booking.
          example: usr_82Kd

        bookingDate:
          type: string
          format: date
          description: Date of the badminton-court booking.
          example: '2026-09-05'

        startTime:
          type: string
          description: Starting time of the requested booking slot.
          example: '15:00'

        endTime:
          type: string
          description: Ending time of the requested booking slot.
          example: '16:00'

    Booking:
      type: object
      required: [id, courtId, userId, bookingDate, startTime, endTime, status]
      properties:
        id:
          type: string
          description: Unique identifier for the booking.
          example: bkg_51Fa

        courtId:
          type: string
          description: Identifier of the booked badminton court.
          example: crt_B16

        userId:
          type: string
          description: Identifier of the user who made the booking.
          example: usr_82Kd

        bookingDate:
          type: string
          format: date
          description: Date of the badminton-court booking.
          example: '2026-09-05'

        startTime:
          type: string
          description: Starting time of the booked slot.
          example: '15:00'

        endTime:
          type: string
          description: Ending time of the booked slot.
          example: '16:00'

        status:
          type: string
          description: Current status of the booking.
          enum: [pending, confirmed, cancelled, completed, rejected]
          example: confirmed

    # ---------------------------------------------------------------
    # RFC 9457 Problem Details. Defined ONCE, referenced everywhere,
    # so that a client able to parse one of your errors can parse all
    # of them. Extension members go alongside these five.
    # ---------------------------------------------------------------
    Problem:
      type: object
      required: [type, title, status]
      # RFC 9457 permits EXTENSION MEMBERS: your own fields alongside the
      # five below. They are what turns a merely correct error into an
      # interface a client can build a good experience on, and they are
      # explicitly assessed in A1 — so the schema must allow them.
      # Remove this line and your own extension members become lint
      # errors, which is exactly how a team ends up with useless errors.
      additionalProperties: true
      properties:
        type:
          type: string
          format: uri
          description: |
            Stable URI identifying the KIND of problem. Client code
            branches on this exact string, so it must never change
            once published.
          example: https://api.example.com/problems/illegal-transition
        title:
          type: string
          description: |
            Short, human-readable, FIXED for a given type. Written for
            a developer reading a log, not for an end user.
          example: That status change is not permitted
        status:
          type: integer
          description: The HTTP status, repeated so the document stays
            meaningful when logged away from its response.
          example: 409
        detail:
          type: string
          description: |
            Specific to this occurrence. Never a stack trace, an SQL
            fragment, or an internal hostname.
          example: thg_51Fa93cD is draft; retirement is refused.
        instance:
          type: string
          description: |
            The URI of this specific occurrence. In Chapter 9 the
            correlation identifier goes here.
          example: /v1/bookings/bkg_51Fa/retirement

  responses:

    BadRequest:
      description: The request was malformed.
      content:
        application/problem+json:
          schema: { $ref: '#/components/schemas/Problem' }
          example:
            type: https://api.example.com/problems/malformed-request
            title: The request could not be parsed
            status: 400

    NotFound:
      description: No such resource — or none you may see.
      content:
        application/problem+json:
          schema: { $ref: '#/components/schemas/Problem' }
          example:
            type: https://api.example.com/problems/not-found
            title: Resource not found
            status: 404

    Conflict:
      description: |
        The request was valid but refused by a business rule. This is a
        domain OUTCOME, not a server error. Do not retry it.
      content:
        application/problem+json:
          schema: { $ref: '#/components/schemas/Problem' }
          example:
            type: https://api.example.com/problems/illegal-transition
            title: That status change is not permitted
            status: 409

    UnprocessableEntity:
      description: Well-formed but semantically invalid.
      content:
        application/problem+json:
          schema: { $ref: '#/components/schemas/Problem' }
          example:
            type: https://api.example.com/problems/validation-failed
            title: One or more fields are invalid
            status: 422
